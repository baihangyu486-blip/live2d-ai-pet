<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:;" />
  <title>Bubble</title>

  <style>
    :root {
      --window-padding: 12px;
      --tail-size: 14px;
      --tail-outset: 7px;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      box-sizing: border-box;
      padding: var(--window-padding);
      background: transparent;
    }

    /*
      透明窗口固定为 330 × 170，
      但 visible-area 只是里面实际粉白气泡可出现的区域。
      后续 bubble.js 会测量 #bubble 的真实位置和尺寸，
      再把尾巴尖端坐标回传 main.js。
    */
    #bubble-area {
      position: relative;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      pointer-events: none;
    }

    #bubble {
      position: absolute;
      top: 0;
      left: 0;
      width: fit-content;
      max-width: 292px;
      min-width: 76px;
      padding: 12px 15px;
      box-sizing: border-box;
      border-radius: 20px;
      background:
        radial-gradient(
          circle at 18% 0%,
          rgba(255, 255, 255, 0.98),
          rgba(255, 240, 248, 0.96) 42%,
          rgba(255, 225, 242, 0.95)
        ),
        linear-gradient(
          180deg,
          rgba(255, 246, 251, 0.98),
          rgba(255, 225, 242, 0.95)
        );
      color: #6d3b55;
      font-size: 13px;
      line-height: 1.55;
      letter-spacing: 0.2px;
      white-space: pre-wrap;
      word-break: break-word;
      border: 1px solid rgba(255, 155, 205, 0.62);
      box-shadow:
        0 10px 26px rgba(214, 84, 150, 0.22),
        0 0 18px rgba(255, 175, 220, 0.22),
        inset 0 0 0 1px rgba(255, 255, 255, 0.72);
      opacity: 0;
      transform: translateY(8px) scale(0.98);
      transition:
        opacity 0.18s ease,
        transform 0.18s ease;
    }

    #bubble.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /*
      气泡在人物左侧：
      气泡贴透明窗口右侧，尾巴从右边伸出并指向人物。
    */
    #bubble.tail-right {
      top: 0;
      right: 0;
      left: auto;
      border-radius: 20px 20px 10px 20px;
    }

    /*
      气泡在人物右侧：
      气泡贴透明窗口左侧，尾巴从左边伸出并指向人物。
    */
    #bubble.tail-left {
      top: 0;
      left: 0;
      right: auto;
      border-radius: 20px 20px 20px 10px;
    }

    /*
      气泡在人物上方：
      气泡水平居中，尾巴从下边伸出并指向人物。
    */
    #bubble.tail-bottom {
      top: 0;
      left: 50%;
      right: auto;
      margin: 0;
      transform: translateX(-50%) translateY(8px) scale(0.98);
      border-radius: 20px;
    }

    #bubble.tail-bottom.show {
      transform: translateX(-50%) translateY(0) scale(1);
    }

    #bubble::before {
      content: "♡";
      position: absolute;
      right: 12px;
      top: -12px;
      color: #ff7eb8;
      font-size: 16px;
      line-height: 1;
      text-shadow:
        0 0 4px rgba(255, 255, 255, 0.9),
        0 0 8px rgba(255, 150, 205, 0.75);
      pointer-events: none;
    }

    #bubble::after {
      content: "";
      position: absolute;
      width: var(--tail-size);
      height: var(--tail-size);
      box-sizing: border-box;
      background: rgba(255, 232, 246, 0.96);
      border-radius: 4px;
      pointer-events: none;
    }

    #bubble.tail-right::after {
      right: calc(var(--tail-outset) * -1);
      bottom: 28px;
      border-right: 1px solid rgba(255, 155, 205, 0.56);
      border-bottom: 1px solid rgba(255, 155, 205, 0.56);
      transform: rotate(-45deg);
    }

    #bubble.tail-left::after {
      left: calc(var(--tail-outset) * -1);
      bottom: 28px;
      border-left: 1px solid rgba(255, 155, 205, 0.56);
      border-bottom: 1px solid rgba(255, 155, 205, 0.56);
      transform: rotate(45deg);
    }

    #bubble.tail-bottom::after {
      left: 50%;
      bottom: calc(var(--tail-outset) * -1);
      border-right: 1px solid rgba(255, 155, 205, 0.56);
      border-bottom: 1px solid rgba(255, 155, 205, 0.56);
      transform: translateX(-50%) rotate(45deg);
    }
  </style>
</head>

<body>
  <div id="bubble-area">
    <div id="bubble" class="tail-right"></div>
  </div>

  <script src="./bubble.js"></script>
</body>
</html>
