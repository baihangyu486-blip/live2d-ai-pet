<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' file: 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; media-src 'self' data: file: blob:; connect-src 'self' file:;" />
  <title>Live2D Pet</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    body {
      user-select: none;
      -webkit-user-select: none;
      background: transparent;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      -webkit-app-region: no-drag;
    }

    #live2d-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      background: transparent;
      z-index: 1;
      -webkit-app-region: no-drag;
    }

    /*
      人物全身互动层。

      只负责：
      - 判断鼠标是否在人物可见范围内；
      - 短按不同身体部位；
      - 把互动部位交给 main.js 统一选择反应。

      不负责拖动窗口。
      不使用 JS 高频 setPosition / setBounds。
    */
    #pet-hit-area {
      position: fixed;
      inset: 0;
      z-index: 12;
      background: transparent;
      cursor: default;
      -webkit-app-region: no-drag;
    }

    #pet-hit-area.pet-interactive {
      cursor: pointer;
    }

    /*
      人物脚下中央附近的透明原生拖动区。

      这是当前稳定拖动方案：
      - 完全透明；
      - 不显示按钮、边框、文字；
      - 使用 Electron / Windows 原生拖动；
      - 不经过 renderer.js 高频 IPC 移动窗口；
      - 避免 Live2D 透明窗口拖动时闪烁、漂移、爱心分离。

      如果后续觉得拖动区域太高 / 太低，只微调 bottom、width、height。
    */
    #pet-native-drag-zone {
      position: fixed;
      left: 50%;
      bottom: 58px;
      width: 104px;
      height: 18px;
      transform: translateX(-50%);
      z-index: 15;
      background: transparent;
      cursor: grab;
      -webkit-app-region: drag;
    }

    #pet-native-drag-zone:active {
      cursor: grabbing;
    }

    /*
      爱心按钮。

      左键：聊天窗口。
      右键：控制台。
    */
    #panel-button {
      position: fixed;
      left: calc(50% + 92px);
      top: 114px;
      width: 34px;
      height: 34px;
      border: none;
      background: transparent;
      color: #ff6faf;
      font-size: 27px;
      line-height: 34px;
      text-align: center;
      cursor: pointer;
      z-index: 20;
      opacity: 0.78;
      text-shadow:
        0 0 4px rgba(255,255,255,0.95),
        0 0 8px rgba(255,160,210,0.85),
        0 3px 8px rgba(255,90,160,0.35);
      -webkit-app-region: no-drag;
      transform-origin: center;
      transition:
        opacity 0.18s ease,
        transform 0.18s ease,
        filter 0.18s ease;
      animation: heartFloat 2.4s ease-in-out infinite;
    }

    #panel-button:hover {
      opacity: 1;
      transform: scale(1.18) rotate(-8deg);
      filter: brightness(1.08) saturate(1.08);
      animation-play-state: paused;
    }

    #panel-button:active {
      transform: scale(0.96) rotate(4deg);
    }

    /* 位置跟随模型头部锚点，由 renderer.js 更新。 */
    #thinking-indicator {
      position: fixed;
      z-index: 22;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 7px 11px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 2px 12px rgba(255, 120, 180, 0.3);
      opacity: 0;
      transform: translate(-50%, -100%);
      transition: opacity 0.2s ease;
      pointer-events: none;
    }

    body.thinking #thinking-indicator {
      opacity: 1;
    }

    #thinking-indicator span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ff6faf;
      animation: thinkDot 1.2s ease-in-out infinite;
    }

    #thinking-indicator span:nth-child(2) {
      animation-delay: 0.18s;
    }

    #thinking-indicator span:nth-child(3) {
      animation-delay: 0.36s;
    }

    @keyframes thinkDot {
      0%, 60%, 100% {
        opacity: 0.35;
        transform: translateY(0);
      }

      30% {
        opacity: 1;
        transform: translateY(-3px);
      }
    }


    body.has-new-message #panel-button {
      animation: heartNotice 0.9s ease-in-out 3;
    }

    @keyframes heartNotice {
      0%, 100% {
        transform: scale(1) rotate(-4deg);
        filter: brightness(1);
      }

      50% {
        transform: scale(1.35) rotate(8deg);
        filter: brightness(1.25) saturate(1.3);
      }
    }

    #model-load-error {
      position: fixed;
      left: 50%;
      top: 154px;
      z-index: 21;
      display: none;
      max-width: 260px;
      padding: 5px 8px;
      transform: translateX(-50%);
      border-radius: 4px;
      background: rgba(100, 20, 40, 0.86);
      color: #fff;
      font-size: 12px;
      line-height: 1.4;
      text-align: center;
      pointer-events: none;
    }

    @keyframes heartFloat {
      0% {
        transform: translateY(0) rotate(-4deg);
      }

      50% {
        transform: translateY(-4px) rotate(4deg);
      }

      100% {
        transform: translateY(0) rotate(-4deg);
      }
    }
  </style>
</head>

<body>
  <canvas id="live2d-canvas"></canvas>

  <div id="pet-hit-area" title=""></div>

  <div id="pet-native-drag-zone" title="按住此处拖动"></div>

  <div id="panel-button">♥</div>
  <div id="thinking-indicator" aria-hidden="true"><span></span><span></span><span></span></div>
  <div id="model-load-error" role="status"></div>

  <script src="./vendor/live2dcubismcore.min.js"></script>
  <script src="./vendor/pixi.min.js"></script>
  <script src="./vendor/cubism4.min.js"></script>
  <script src="./renderer.js"></script>
</body>
</html>
